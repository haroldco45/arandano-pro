<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arándano Pro — Guía del arandanero</title>
<meta name="description" content="App para el cultivador de arándanos: alertas de helada y calor con el clima real de su finca, guía de cultivo en Colombia, calculadoras, bitácora y lista BPA. Español / English.">
<meta name="theme-color" content="#151a3f">
<meta property="og:type" content="website">
<meta property="og:title" content="Arándano Pro — Guía del arandanero">
<meta property="og:description" content="Alertas de helada y calor con el clima real, guía de cultivo en Colombia, calculadoras de siembra, cosecha y plata, bitácora y lista BPA.">
<meta property="og:image" content="https://arandano-pro.netlify.app/og-image.jpg">
<meta property="og:url" content="https://arandano-pro.netlify.app/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Arándano Pro — Guía del arandanero">
<meta name="twitter:description" content="Alertas de helada y calor, guía de cultivo, calculadoras, bitácora y lista BPA para el arandanero.">
<meta name="twitter:image" content="https://arandano-pro.netlify.app/og-image.jpg">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#151a3f;--night2:#222a63;--berry:#3c48b0;--bloom:#8fa2ff;--frost:#dfe6ff;
  --leaf:#2f7d4f;--leaf2:#e3f2e8;--amber:#c97c0e;--amber2:#fff1da;--red:#b8322a;--red2:#fde5e2;
  --bg:#f5f4ef;--card:#ffffff;--ink:#1a1d2e;--mute:#5d6175;--line:#e3e2dc;
  --r:18px;--shadow:0 10px 30px -14px rgba(21,26,63,.35);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1029;--card:#181c3d;--ink:#eef0ff;--mute:#a7abc8;--line:#2a2f5a;
    --leaf2:#16301f;--amber2:#33260f;--red2:#3a1614;--frost:#232a5c;
  }
}
:root[data-theme="dark"]{--bg:#0e1029;--card:#181c3d;--ink:#eef0ff;--mute:#a7abc8;--line:#2a2f5a;--leaf2:#16301f;--amber2:#33260f;--red2:#3a1614;--frost:#232a5c}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.12;margin:0 0 .4em;letter-spacing:-.01em}
h2{font-size:clamp(1.6rem,5vw,2.3rem)}
h3{font-size:1.2rem}
p{margin:.3em 0 .9em}
a{color:var(--berry)}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}

/* header */
.top{position:sticky;top:0;z-index:30;background:rgba(21,26,63,.92);backdrop-filter:blur(10px);color:#fff}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:58px}
.brand{font-family:Fraunces,serif;font-weight:800;font-size:1.15rem;line-height:1.1}
.brand small{display:block;font-family:Manrope;font-weight:500;font-size:.72rem;color:var(--bloom);letter-spacing:.04em}
.top .sp{flex:1}
.pill{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:.8rem;cursor:pointer}
.pill:active{transform:scale(.96)}
.pill.on{background:#fff;color:var(--night)}

/* hero */
.hero{position:relative;min-height:440px;color:#fff;overflow:hidden;background:var(--night)}
.slides{position:absolute;inset:0}
.slides img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s ease;animation:kb 14s ease-in-out infinite alternate}
.slides img.on{opacity:1}
@keyframes kb{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.16) translate(-2%,-2%)}}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,26,63,.25) 0%,rgba(21,26,63,.55) 45%,rgba(21,26,63,.96) 100%)}
.hero .wrap{position:relative;z-index:2;padding-top:110px;padding-bottom:28px}
.kicker{font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--bloom)}
.hero h1{font-size:clamp(2.3rem,9vw,4.2rem);margin:.15em 0 .2em}
.hero p{max-width:560px;color:#e3e6ff}
.cap{position:absolute;right:12px;bottom:10px;z-index:3;font-size:.7rem;color:#cfd4ff;opacity:.85}
.ticker{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-top:16px;padding-bottom:4px}
.ticker::-webkit-scrollbar{display:none}
.tk{flex:0 0 auto;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:10px 14px;min-width:120px}
.tk b{display:block;font-family:Fraunces,serif;font-size:1.5rem;line-height:1.1}
.tk span{font-size:.75rem;color:#cfd4ff}

/* sections */
.view{display:none;animation:fade .45s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
section{padding:28px 0 8px}
.sub{color:var(--mute);margin-top:-.2em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.grid{display:grid;gap:16px}
@media(min-width:720px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.photo{border-radius:var(--r);overflow:hidden;position:relative;background:var(--night)}
.photo img{width:100%;height:220px;object-fit:cover;transition:transform 6s ease}
.photo:hover img{transform:scale(1.08)}
.photo figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;background:linear-gradient(transparent,rgba(10,12,35,.85));color:#fff;font-size:.78rem}
figure{margin:0}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-weight:700;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--berry);border-color:var(--berry);color:#fff}

/* weather */
.days{display:grid;grid-template-columns:repeat(7,minmax(98px,1fr));gap:8px;overflow-x:auto;padding-bottom:6px}
.day{border-radius:14px;padding:10px;background:var(--frost);text-align:center;font-size:.8rem;border:2px solid transparent}
.day b{font-family:Fraunces,serif;font-size:1.05rem;display:block;white-space:nowrap}
.day.r{border-color:var(--amber);background:var(--amber2)}
.day.d{border-color:var(--red);background:var(--red2)}
.alert{border-left:6px solid var(--leaf);background:var(--leaf2);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:.93rem}
.alert.r{border-color:var(--amber);background:var(--amber2)}
.alert.d{border-color:var(--red);background:var(--red2)}
.alert b{display:block}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>*{flex:1 1 140px}
label{display:block;font-size:.78rem;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
input,select,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--berry)}
.btn{background:var(--berry);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}
.btn.ghost{background:transparent;color:var(--berry);border:1.5px solid var(--berry)}
.btn.sm{padding:8px 12px;font-size:.85rem}
.btn:active{transform:scale(.97)}
.big{font-family:Fraunces,serif;font-size:clamp(1.8rem,6vw,2.6rem);font-weight:800;line-height:1.05}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.kv div{background:var(--bg);border-radius:12px;padding:10px 12px}
.kv span{display:block;font-size:.74rem;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.kv b{font-family:Fraunces,serif;font-size:1.25rem}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.scroll{overflow-x:auto}

/* thermometer */
.thermo{position:relative;height:56px;margin:18px 4px 30px;border-radius:12px;background:linear-gradient(90deg,#2a3aa8 0%,#6d86ff 45%,#c9d3ff 75%,#ffe9c8 100%)}
.tmark{position:absolute;top:-8px;bottom:-8px;width:3px;background:var(--ink)}
.tmark span{position:absolute;top:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:.72rem;font-weight:800;margin-top:4px}
.tmark i{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-style:normal;font-size:.72rem;font-weight:800;margin-bottom:2px}

/* tabs inner */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:6px 0 16px;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;border:0;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:800;font-size:.85rem;cursor:pointer}
.seg button.on{background:var(--night);color:#fff;border-color:var(--night)}

/* bars */
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--berry),var(--bloom));border-radius:99px;transition:width .8s ease}
svg text{font-family:Manrope,sans-serif}

/* checklist */
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.chk .box{flex:0 0 24px;height:24px;border-radius:7px;border:2px solid var(--berry);display:grid;place-items:center;margin-top:2px;transition:background .2s}
.chk.on .box{background:var(--berry)}
.chk.on .box:after{content:"";width:10px;height:6px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.chk.on .t{color:var(--mute);text-decoration:line-through}

/* log */
.log{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.log .d{flex:0 0 58px;text-align:center;background:var(--frost);border-radius:12px;padding:6px 4px;font-size:.72rem;font-weight:700}
.log .d b{display:block;font-family:Fraunces,serif;font-size:1.3rem}
.log .x{margin-left:auto;background:none;border:0;color:var(--mute);cursor:pointer;font-weight:800}

/* crops */
.crop{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:start}
.crop img{width:110px;height:130px;object-fit:cover;border-radius:14px}
.tag{display:inline-block;font-size:.72rem;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--frost);margin:2px 4px 2px 0}
.tag.g{background:var(--leaf2);color:var(--leaf)}
.tag.a{background:var(--amber2);color:var(--amber)}

/* nav */
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -8px 24px -18px rgba(0,0,0,.4)}
nav.bot .wrap{display:flex;justify-content:space-between;padding:0 6px}
nav.bot button{flex:1;border:0;background:none;padding:12px 2px 13px;font-weight:800;font-size:.78rem;color:var(--mute);cursor:pointer;position:relative}
nav.bot button.on{color:var(--berry)}
nav.bot button.on:before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 4px 4px;background:var(--berry)}

.avc-promo{position:relative;margin-top:4px;border-radius:var(--r);overflow:hidden;min-height:260px;cursor:pointer;color:#fff;background:var(--night);box-shadow:var(--shadow)}
.avc-promo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 16s ease-in-out infinite alternate}
.avc-promo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(21,26,63,.95) 0%,rgba(21,26,63,.75) 55%,rgba(21,26,63,.25) 100%)}
.avc-promo-t{position:relative;z-index:2;padding:22px;max-width:560px}
.avc-promo-t .kicker{color:var(--bloom)}
.avc-promo-t h3{font-size:1.45rem;margin:.3em 0}
.avc-promo-t p{color:#dfe3ff}
.avc-promo-t .btn{display:inline-block;background:#fff;color:var(--night)}
.tl{position:relative;padding-left:22px;border-left:3px solid var(--bloom);margin:6px 0 4px 6px}
.tl div{position:relative;margin-bottom:14px}
.tl div:before{content:"";position:absolute;left:-30px;top:5px;width:13px;height:13px;border-radius:50%;background:var(--berry);border:3px solid var(--card)}
.tl b{display:block;color:var(--berry);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.install{display:none;position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:45;background:var(--night);color:#fff;border-radius:16px;padding:14px;box-shadow:var(--shadow);align-items:center;gap:10px}
.install.show{display:flex}
.install p{margin:0;flex:1;font-size:.9rem}
footer{padding:30px 0 20px;color:var(--mute);font-size:.82rem;text-align:center}
footer b{color:var(--ink)}
.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:#58d68d;margin-right:6px;animation:pl 1.6s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(88,214,141,.7)}100%{box-shadow:0 0 0 12px rgba(88,214,141,0)}}
.muted{color:var(--mute);font-size:.85rem}
.note{font-size:.8rem;color:var(--mute);border-top:1px dashed var(--line);padding-top:8px;margin-top:10px}
.toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-20px);opacity:0;background:var(--night);color:#fff;padding:10px 16px;border-radius:12px;z-index:60;transition:.3s;font-weight:700;font-size:.9rem;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">Arándano Pro<small id="fincaLbl"></small></div>
    <div class="sp"></div>
    <button class="pill" id="btnRefresh" data-t="refresh"></button>
    <button class="pill" id="btnEs">ES</button>
    <button class="pill" id="btnEn">EN</button>
  </div>
</header>

<main>
  <!-- HOY -->
  <div class="view on" id="v-hoy">
    <div class="hero">
      <div class="slides" id="slides"></div>
      <div class="wrap">
        <div class="kicker" id="heroDate"></div>
        <h1 id="heroTitle"></h1>
        <p id="heroText"></p>
        <div class="ticker" id="ticker"></div>
      </div>
      <div class="cap" id="heroCap"></div>
    </div>
    <div class="wrap">
      <section>
        <h2 data-t="todayTitle"></h2>
        <p class="sub" data-t="todaySub"></p>
        <div class="card">
          <div class="row">
            <div><label data-t="lblPlace"></label><select id="place"></select></div>
            <div style="flex:0 0 auto"><button class="btn ghost" id="btnGeo" data-t="useGps"></button></div>
          </div>
          <label style="margin-top:14px" data-t="lblStages"></label>
          <div class="chips" id="stages"></div>
          <div id="wxStatus" class="muted" style="margin-top:10px"></div>
        </div>
        <div id="wxOut"></div>
      </section>
      <section>
        <div class="grid g2">
          <div class="card reveal">
            <div class="kicker" style="color:var(--berry)" data-t="tipKicker"></div>
            <h3 id="tipTitle"></h3>
            <p id="tipText"></p>
            <button class="btn sm ghost" id="btnTip" data-t="nextTip"></button>
          </div>
          <div class="card reveal">
            <div class="kicker" style="color:var(--berry)" data-t="farmKicker"></div>
            <div id="farmSummary"></div>
          </div>
        </div>
        <div class="avc-promo reveal" id="avcPromo" onclick="mktTab='avc';go('mercado');renderMkt()">
          <img src="img/huerto-otono.jpg" alt="">
          <div class="avc-promo-t"><div class="kicker" data-t="avcKicker"></div><h3 data-t="avcPromoT"></h3><p data-t="avcPromoP"></p><span class="btn sm" data-t="avcPromoB"></span></div>
        </div>
      </section>
      <section>
        <h2 data-t="manualTitle"></h2>
        <p class="sub" data-t="manualSub"></p>
        <div class="card">
          <div class="row">
            <div><label data-t="lblMin"></label><input type="number" step="0.1" id="mMin" placeholder="2"></div>
            <div><label data-t="lblMax"></label><input type="number" step="0.1" id="mMax" placeholder="22"></div>
            <div><label data-t="lblRain"></label><input type="number" step="0.1" id="mRain" placeholder="0"></div>
          </div>
          <div id="manualOut" style="margin-top:10px"></div>
        </div>
      </section>
    </div>
  </div>

  <!-- CULTIVO -->
  <div class="view" id="v-cultivo">
    <div class="wrap">
      <section>
        <div class="kicker" style="color:var(--berry)" data-t="cropKicker"></div>
        <h2 data-t="cropTitle"></h2>
        <p class="sub" data-t="cropSub"></p>
        <div class="seg" id="segCrop"></div>
        <div id="cropOut"></div>
      </section>
    </div>
  </div>

  <!-- CALCULAR -->
  <div class="view" id="v-calc">
    <div class="wrap">
      <section>
        <div class="kicker" style="color:var(--berry)" data-t="calcKicker"></div>
        <h2 data-t="calcTitle"></h2>
        <p class="sub" data-t="calcSub"></p>
        <div class="seg" id="segCalc"></div>
        <div id="calcOut"></div>
      </section>
    </div>
  </div>

  <!-- FINCA -->
  <div class="view" id="v-finca">
    <div class="wrap">
      <section>
        <div class="kicker" style="color:var(--berry)" data-t="finKicker"></div>
        <h2 data-t="finTitle"></h2>
        <p class="sub" data-t="finSub"></p>
        <div class="seg" id="segFin"></div>
        <div id="finOut"></div>
      </section>
    </div>
  </div>

  <!-- MERCADO -->
  <div class="view" id="v-mercado">
    <div class="wrap">
      <section>
        <div class="kicker" style="color:var(--berry)" data-t="mktKicker"></div>
        <h2 data-t="mktTitle"></h2>
        <p class="sub" data-t="mktSub"></p>
        <div class="seg" id="segMkt"></div>
        <div id="mktOut"></div>
      </section>
    </div>
  </div>

  <footer class="wrap">
    <p data-t="sourcesFoot"></p>
    <p><b>Desarrollada por Vibras Positivas HM — Derechos de Autor Reservados</b><br><a href="https://vibraspositivashm.com" target="_blank" rel="noopener">vibraspositivashm.com</a></p>
  </footer>
</main>

<div class="install" id="install"><p data-t="installMsg"></p><button class="btn sm" id="btnInstall" data-t="install"></button><button class="pill" id="btnNoInstall">×</button></div>
<div class="toast" id="toast"></div>

<nav class="bot"><div class="wrap">
  <button data-v="hoy" class="on" data-t="navHoy"></button>
  <button data-v="cultivo" data-t="navCultivo"></button>
  <button data-v="calc" data-t="navCalc"></button>
  <button data-v="finca" data-t="navFinca"></button>
  <button data-v="mercado" data-t="navMercado"></button>
</div></nav>

<script>
/* ============ storage helpers ============ */
const S={get(k,d){try{const v=localStorage.getItem('ap_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('ap_'+k,JSON.stringify(v))}catch(e){}}};
let L=S.get('lang','es');
const t=(es,en)=>L==='en'?en:es;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const nf=(n,d=0)=>isFinite(n)?Number(n).toLocaleString(L==='en'?'en-US':'es-CO',{maximumFractionDigits:d,minimumFractionDigits:0}):'—';
const money=n=>isFinite(n)?'$'+nf(Math.round(n)):'—';
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200)}
const bogota=()=>new Date(new Date().toLocaleString('en-US',{timeZone:'America/Bogota'}));
const todayISO=()=>{const d=bogota();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

/* ============ UI strings ============ */
const UI={
 refresh:['Actualizar','Refresh'],

let selStages=S.get('stages',['flor','fruto','cosecha']);

function coords(){const v=S.get('place',0);if(v==='gps'){const g=S.get('gps',null);if(g)return{lat:g.lat,lon:g.lon,name:t('Mi ubicación','My location')}}const p=PLACES[+v]||PLACES[0];return{lat:p[1],lon:p[2],name:p[0]}}
async function loadWx(force){
  const c=coords();
  $('#wxStatus').innerHTML=`<span class="pulse"></span>${t('Buscando el pronóstico de','Fetching forecast for')} ${c.name}…`;
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,shortwave_radiation_sum,et0_fao_evapotranspiration&current=temperature_2m,relative_humidity_2m&timezone=America%2FBogota&forecast_days=7`;
  try{
    const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();
    j._at=Date.now();j._name=c.name;S.set('wx',j);renderWx();
  }catch(e){
    const old=S.get('wx',null);renderWx();
    $('#wxStatus').textContent=old?t('Sin internet: mostrando el último pronóstico guardado.','Offline: showing the last saved forecast.'):t('No se pudo traer el pronóstico. Usa la revisión a mano de abajo.','Could not load the forecast. Use the manual check below.');
  }
}
function evalDay(mn,mx,rain,rad){
  const out=[];let lvl=0;
  STAGES.filter(s=>selStages.includes(s.id)&&s.crit!==null).forEach(s=>{
    if(mn<=s.crit){out.push(['d',t(`Helada con daño probable en ${s.es.toLowerCase()}`,`Likely frost damage at ${s.en.toLowerCase()}`),t(`La mínima (${nf(mn,1)} °C) llega a la temperatura crítica de ${nf(s.crit,1)} °C.`,`The low (${nf(mn,1)} °C) reaches the ${nf(s.crit,1)} °C critical temperature.`)]);lvl=2}
    else if(mn<=s.crit+2){out.push(['r',t(`Riesgo de helada en ${s.es.toLowerCase()}`,`Frost risk at ${s.en.toLowerCase()}`),t(`La mínima del aire (${nf(mn,1)} °C) queda a menos de 2 °C de la crítica (${nf(s.crit,1)} °C). En noches despejadas la planta se enfría más que el aire.`,`Air low (${nf(mn,1)} °C) is within 2 °C of critical (${nf(s.crit,1)} °C). On clear nights plants get colder than the air.`)]);lvl=Math.max(lvl,1)}
  });
  if(selStages.includes('flor')&&mn<=0&&!out.length){out.push(['r',t('Bajo cero en floración','Below zero in bloom'),t('La guía marca las heladas en floración (bajo 0 °C) como riesgo principal.','The guide flags bloom frosts (below 0 °C) as a main risk.')]);lvl=Math.max(lvl,1)}
  if(mx>=30){out.push(['d',t('Calor extremo','Extreme heat'),t(`Máxima de ${nf(mx,1)} °C: pasa el límite de crecimiento (29–30 °C). Riego temprano, bloqueador solar y sombra.`,`High of ${nf(mx,1)} °C passes the growth limit (29–30 °C). Irrigate early, sunscreen and shade.`)]);lvl=2}
  else if(mx>=28){out.push(['r',t('Calor: la planta se deshidrata','Heat: plant dehydrates'),t(`Máxima de ${nf(mx,1)} °C. Sobre 28 °C baja la fotosíntesis y el calibre del fruto.`,`High of ${nf(mx,1)} °C. Above 28 °C photosynthesis and berry size drop.`)]);lvl=Math.max(lvl,1)}
  if(selStages.includes('cosecha')&&rain>5){out.push(['r',t('Lluvia en cosecha','Rain at harvest'),t(`${nf(rain,1)} mm anunciados (más de 5 mm). Adelanta la cosecha o cosecha bajo cubierta.`,`${nf(rain,1)} mm forecast (over 5 mm). Pick earlier or under cover.`)]);lvl=Math.max(lvl,1)}
  if(rad!=null&&rad>=27){out.push(['r',t('Radiación alta','High radiation'),t(`${nf(rad,1)} MJ/m²: riesgo de golpe de sol en la fruta (desde 27 MJ/m²).`,`${nf(rad,1)} MJ/m²: sunburn risk on fruit (from 27 MJ/m²).`)]);lvl=Math.max(lvl,1)}
  return{out,lvl};
}
function renderWx(){
  const j=S.get('wx',null);
  if(!j||!j.daily){$('#wxOut').innerHTML='';return}
  const d=j.daily;const ago=Math.round((Date.now()-j._at)/60000);
  $('#wxStatus').innerHTML=`<span class="pulse"></span>${j._name} · ${t('altura','elevation')} ${nf(j.elevation)} m · ${t('actualizado hace','updated')} ${ago<1?t('un momento','just now'):ago+' min'+(L==='en'?' ago':'')}`;
  let days='',alerts='',gdd=0,worst=0;
  d.time.forEach((day,i)=>{
    const mn=d.temperature_2m_min[i],mx=d.temperature_2m_max[i],rn=d.precipitation_sum[i],rd=d.shortwave_radiation_sum?d.shortwave_radiation_sum[i]:null;
    const e=evalDay(mn,mx,rn,rd);worst=Math.max(worst,e.lvl);
    gdd+=Math.max(0,(mn+mx)/2-10);
    const dt=new Date(day+'T12:00:00');
    const nm=i===0?t('Hoy','Today'):dt.toLocaleDateString(L==='en'?'en-US':'es-CO',{weekday:'short',day:'numeric'});
    days+=`<div class="day ${e.lvl===2?'d':e.lvl===1?'r':''}"><div>${nm}</div><b>${nf(mn,0)}° / ${nf(mx,0)}°</b><div>${nf(rn,1)} mm</div>${rd!=null?`<div class="muted">${nf(rd,0)} MJ</div>`:''}</div>`;
    if(e.out.length) alerts+=`<div style="margin-top:6px;font-weight:800">${nm}</div>`+e.out.map(a=>`<div class="alert ${a[0]}"><b>${a[1]}</b>${a[2]}</div>`).join('');
  });
  const now=j.current?`<div class="kv"><div><span>${t('Ahora','Now')}</span><b>${nf(j.current.temperature_2m,1)} °C</b></div><div><span>${t('Humedad','Humidity')}</span><b>${nf(j.current.relative_humidity_2m)}%</b></div><div><span>${t('Días‑grado semana','Degree‑days week')}</span><b>${nf(gdd,0)}</b></div><div><span>${t('Días de yema a cosecha','Bud to harvest days')}</span><b>${gdd>0?'≈ '+nf(495/(gdd/7),0):'—'}</b></div>${d.et0_fao_evapotranspiration?`<div><span>${t('Agua que pide hoy (ET0)','Water demand today (ET0)')}</span><b>${nf(d.et0_fao_evapotranspiration[0],1)} mm</b></div>`:''}</div>`:'';
  const head=worst===2?['d',t('Atención: hay días con daño probable','Warning: days with likely damage')]:worst===1?['r',t('Hay días para estar pendiente','Some days to watch')]:['',t('Semana tranquila para tus plantas','A calm week for your plants')];

function irr(cf){let lo=-.99,hi=5;const npv=r=>cf.reduce((a,c,i)=>a+c/Math.pow(1+r,i),0);if(npv(lo)*npv(hi)>0)return NaN;for(let k=0;k<200;k++){const m=(lo+hi)/2;npv(lo)*npv(m)<=0?hi=m:lo=m}return(lo+hi)/2}
function calcMoney(){
  const ha=g('ha',1),kg=g('kg',15000),pr=g('pr',1182),inv=g('inv',10000000),cost=g('cost',6661008),r=g('tasa',10)/100;
  const PROD=[0,0,0,.13,.3,.6,.88,1,1,1,1,1,1],COST=[0,.24,.21,.33,.47,.7,.91,1,1,1,1,1,1];
  if([kg,pr,inv,cost].some(isNaN)){$('#pOut').innerHTML=`<p class="muted" style="margin-top:12px">${t('Llena los cuatro datos para ver la proyección.','Fill the four values to see the projection.')}</p>`;return}
  const cf=[],inc=[],cs=[],acc=[];let a=0,pay=null;
  for(let y=0;y<=12;y++){const I=y?PROD[y]*kg*pr*ha:0,Cc=y?COST[y]*cost*ha:inv*ha,f=I-Cc;inc.push(I);cs.push(Cc);cf.push(f);a+=f;acc.push(a);if(pay===null&&y>0&&a>=0)pay=y}
  const npv=cf.reduce((s,c,i)=>s+c/Math.pow(1+r,i),0),ti=irr(cf);
  const full=kg*pr*ha-cost*ha;
  const W=640,H=230,pad=34,max=Math.max(...acc.map(Math.abs),...inc)||1,bw=(W-pad*2)/13;
  const y0=H/2;const sc=v=>v/max*(H/2-18);
  let bars='';for(let y=0;y<=12;y++){const x=pad+y*bw;bars+=`<rect x="${x+bw*.15}" y="${y0-Math.max(0,sc(inc[y]))}" width="${bw*.32}" height="${Math.abs(sc(inc[y]))}" fill="var(--bloom)" rx="3"><animate attributeName="height" from="0" to="${Math.abs(sc(inc[y]))}" dur=".8s"/></rect><rect x="${x+bw*.5}" y="${y0}" width="${bw*.32}" height="${Math.abs(sc(cs[y]))}" fill="var(--amber)" opacity=".75" rx="3"/><text x="${x+bw/2}" y="${H-2}" font-size="11" text-anchor="middle" fill="currentColor">${y}</text>`}
  const line=acc.map((v,i)=>`${pad+i*bw+bw/2},${y0-sc(v)}`).join(' ');
  $('#pOut').innerHTML=`<div class="kv"><div><span>${t('Utilidad al año en plena producción','Yearly profit at full production')}</span><b>${money(full)}</b></div><div><span>VAN / NPV ${nf(r*100)}%</span><b>${money(npv)}</b></div><div><span>TIR / IRR</span><b>${isFinite(ti)?nf(ti*100,1)+'%':'—'}</b></div><div><span>${t('Recuperas la inversión','Payback')}</span><b>${pay?t('año ','year ')+pay:t('después de 12 años','after 12 years')}</b></div></div>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;margin-top:14px;color:var(--mute)"><line x1="${pad}" x2="${W-pad}" y1="${y0}" y2="${y0}" stroke="currentColor" stroke-width="1"/>${bars}<polyline points="${line}" fill="none" stroke="var(--berry)" stroke-width="3"/>${acc.map((v,i)=>`<circle cx="${pad+i*bw+bw/2}" cy="${y0-sc(v)}" r="3.5" fill="var(--berry)"/>`).join('')}</svg>
  <div class="chips"><span class="tag" style="background:var(--bloom);color:#fff">${t('Ingresos','Income')}</span><span class="tag a">${t('Costos e inversión','Costs & investment')}</span><span class="tag" style="background:var(--berry);color:#fff">${t('Plata acumulada','Cumulative cash')}</span></div>
  <p class="note">${t('Con el ejemplo de la guía (1 ha, 15.000 kg/ha, $1.182/kg, inversión $10 millones, costo $6,66 millones) CIREN reporta VAN de $23 millones, TIR 27,4% y recuperación al año 6. En Colombia, Asocolblue habla de inversiones de 50 a 60 mil dólares por hectárea (2020) y productores tecnificados que buscan superar 30 toneladas por hectárea: pon tus cifras reales.','With the guide example (1 ha, 15,000 kg/ha, $1,182/kg, $10M investment, $6.66M cost) CIREN reports NPV $23M, IRR 27.4% and payback in year 6. In Colombia, investments of US$50–60k per hectare (2020) are cited and technified growers aim above 30 t/ha: enter your real numbers.')}</p>`;
}

    <div class="grid g2"><div class="card reveal"><h3>${t('Quién produce (2018)','Who grows it (2018)')}</h3>${share([[t('Estados Unidos','United States'),47],['Canadá',25.6],['Chile',7.6],['Perú',6.7],[t('España','Spain'),3.1],[t('Otros','Others'),10.1]])}</div>
    <div class="card reveal"><h3>${t('Quién exporta (2017)','Who exports (2017)')}</h3>${share([['Chile',27],['Canadá',26],[t('Estados Unidos','United States'),12],[t('Países Bajos','Netherlands'),10],[t('España','Spain'),8],[t('Marruecos','Morocco'),5]])}</div></div>
    <div class="card reveal"><h3>${t('Lección de Chile','Lesson from Chile')}</h3><p>${t('En la temporada 2019/2020 el kilo bajó de unos 8 a 4 dólares por la guerra comercial y la competencia de Perú y México. Estados Unidos recibe el 52% de lo que exporta Chile y Europa el 32%. Moraleja: no depender de un solo comprador ni de un solo mercado.','In 2019/2020 the price fell from about US$8 to US$4 per kilo due to the trade war and competition from Peru and Mexico. The U.S. takes 52% of Chile’s exports and Europe 32%. Moral: don’t rely on one buyer or market.')}</p></div>`;
  }
  if(mktTab==='otros'){
    const mx=50;
    o.innerHTML=`<div class="card reveal"><h3>${t('Rentabilidad comparada (TIR a 12 años)','Compared returns (12‑year IRR)')}</h3>${CROPS.filter(c=>c.tir).map(c=>`<div style="margin:9px 0"><div class="row" style="flex-wrap:nowrap;justify-content:space-between"><b style="flex:1">${c[L]}</b><span style="flex:0 0 auto">${nf(c.tir,1)}%</span></div><div class="bar"><i style="width:${c.tir/mx*100}%;${c.k==='arandano'?'background:var(--berry)':''}"></i></div></div>`).join('')}
    <p class="note">${t('Valores de la guía CIREN para el Maule (Chile), en pesos chilenos de 2020, nivel tecnológico medio. Los frutales de mucho frío (nogal, cerezo, pistacho, avellano, ciruelo) piden horas frío que en el trópico casi no se dan; papa, cebolla y quinua sí se siembran en tierra fría colombiana.','CIREN guide values for Maule (Chile), in 2020 Chilean pesos, medium technology. High‑chill fruit (walnut, cherry, pistachio, hazelnut, plum) need chill hours the tropics rarely give; potato, onion and quinoa are grown in Colombia’s cool highlands.')}</p></div>
    <div class="grid g2">${CROPS.filter(c=>c.k!=='arandano').map(c=>`<div class="card reveal"><div class="crop"><img src="img/${c.img}.jpg" alt="${c[L]}" loading="lazy"><div><h3>${c[L]}</h3>${c.col?`<span class="tag g">${t('Tierra fría colombiana','Colombian highlands')}</span>`:`<span class="tag a">${t('Necesita horas frío','Needs chill hours')}</span>`}${c.tir?`<span class="tag">TIR ${nf(c.tir,1)}%</span>`:''}
    <p style="font-size:.88rem;margin-top:6px"><b>${t('Clima','Climate')}:</b> ${t(c.clima[0],c.clima[1])}<br><b>${t('Suelo','Soil')}:</b> ${t(c.suelo[0],c.suelo[1])}<br><b>${t('Plata','Money')}:</b> ${t(c.eco[0],c.eco[1])}</p></div></div></div>`).join('')}</div>`;
  }
  observe();
}

/* ============ NAV / misc ============ */
function go(v){$$('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));$$('nav.bot button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));window.scrollTo({top:0,behavior:'smooth'});S.set('view',v);observe()}
$$('nav.bot button').forEach(b=>b.onclick=()=>go(b.dataset.v));
let io;function observe(){if(!('IntersectionObserver'in window)){$$('.reveal').forEach(e=>e.classList.add('in'));return}io=io||new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08});$$('.reveal:not(.in)').forEach(e=>io.observe(e))}
function renderAll(){applyUI();renderHero();setCap();renderStages();renderPlaces();renderWx();renderTip();renderFarm();renderCrop();renderCalc();renderFin();renderMkt();manualCheck();observe()}
$('#btnEs').onclick=()=>{L='es';S.set('lang',L);renderAll()};
$('#btnEn').onclick=()=>{L='en';S.set('lang',L);renderAll()};
$('#btnRefresh').onclick=()=>{loadWx(true);renderHero();toast(t('Actualizando…','Refreshing…'))};
$('#btnTip').onclick=()=>{tipI=(tipI+1)%TIPS.length;renderTip()};
$('#place').onchange=e=>{S.set('place',e.target.value);loadWx(true)};
$('#btnGeo').onclick=()=>{if(!navigator.geolocation){toast(t('Tu celular no da la ubicación','Location not available'));return}
  navigator.geolocation.getCurrentPosition(p=>{S.set('gps',{lat:p.coords.latitude,lon:p.coords.longitude});S.set('place','gps');renderPlaces();loadWx(true)},()=>toast(t('No se pudo leer la ubicación','Could not read location')),{enableHighAccuracy:true,timeout:15000})};
['#mMin','#mMax','#mRain'].forEach(s=>$(s).oninput=manualCheck);
setInterval(renderHero,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const j=S.get('wx',null);if(!j||Date.now()-j._at>30*60000)loadWx()}});

/* install */
let dp;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;if(!S.get('noInstall',false))$('#install').classList.add('show')});
$('#btnInstall').onclick=async()=>{$('#install').classList.remove('show');if(dp){dp.prompt();await dp.userChoice;dp=null}};
$('#btnNoInstall').onclick=()=>{$('#install').classList.remove('show');S.set('noInstall',true)};
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

buildHero();renderAll();go(S.get('view','hoy'));loadWx();
</script>
